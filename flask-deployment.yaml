
apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask-api

spec:
  replicas: 3

  selector:
    matchLabels:
      app: flask-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:
    metadata:
      labels:
        app: flask-api

    spec:
      containers:
        - name: flask-api
          image: task12-flask-api:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          env:
            - name: TASK14_VERSION
              value: "v2"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "500m"
              memory: "1Gi"